name: 自动构建并发布版本

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 Windows 发布包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出标签代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 检查发布标签
        id: release_info
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "发布标签必须是 vMAJOR.MINOR.PATCH 格式，当前值：$tag"
          }
          $version = $Matches[1]
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 构建发布包
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
        shell: pwsh
        run: |
          & .\build.ps1 -Version $env:RELEASE_VERSION -SkipTests
          if ($LASTEXITCODE -ne 0) { throw "构建脚本失败，退出码：$LASTEXITCODE" }

      - name: 检查构建产物
        id: artifact
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
        shell: pwsh
        run: |
          $versionData = Get-Content -LiteralPath "build/version.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$versionData.version -ne $env:RELEASE_VERSION) {
            throw "构建版本与推送标签不一致。"
          }
          $path = Join-Path "PLUGIN" "douyin-auto-spark-$env:RELEASE_VERSION-windows.zip"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "未找到发布压缩包：$path"
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 生成发布说明
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $content = @"
          ## 发布内容

          - 根据标签 `$tag` 构建 Windows 完整程序包。
          - 发布版本号与标签一致；版本文件只在本次构建工作目录中更新。
          - 发布包包含 Java 运行时、Chromium 浏览器、程序主包、启动诊断脚本和使用说明。

          ## 使用方式

          1. 下载 `douyin-auto-spark-$version-windows.zip`。
          2. 完整解压整个文件夹，不要只复制单个启动入口，也不要直接在压缩包中运行。
          3. 优先双击“抖音自动续火花助手.exe”；如果发布包内没有 `.exe`，请双击“抖音自动续火花助手.bat”。
          4. 首次使用点击“打开登录/聊天页”，手动完成抖音创作者中心登录。

          ## 注意事项

          - 程序不会绕过验证码、风控、扫码登录或账号安全验证。
          - 配置、日志、状态和失败截图保存在 `%APPDATA%\DouyinAutoSpark`。
          - 如页面结构变化导致发送失败，请提交脱敏后的日志摘要和失败截图。
          "@
          $normalized = ($content -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          [System.IO.File]::WriteAllText("release-notes.md", $normalized + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_FILE: ${{ steps.artifact.outputs.path }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "$env:RELEASE_FILE" --verify-tag --title "抖音自动续火花助手 $env:RELEASE_VERSION" --notes-file "release-notes.md" --latest

      - name: 上传工作流构建产物
        uses: actions/upload-artifact@v7
        with:
          name: 抖音自动续火花助手-${{ steps.release_info.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
