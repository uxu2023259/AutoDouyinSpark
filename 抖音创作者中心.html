<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>抖音创作者中心离线选择器测试快照</title>
</head>
<body>
  <main id="root">
    <section class="conversation-list">
      <div aria-label="grid" aria-readonly="true" class="ReactVirtualized__Grid ReactVirtualized__List" role="grid" tabindex="0">
        <div class="ReactVirtualized__Grid__innerScrollContainer" role="row">
          <div role="gridcell">
            <li class="semi-list-item selected-test" role="list-item">
              <span class="item-header-name-test">测试会话</span>
            </li>
          </div>
        </div>
      </div>
    </section>
    <section class="chat-box">
      <header class="box-header-bb4JnP">
        <strong class="box-header-name-z3_MyF">测试会话</strong>
      </header>
      <div class="chat-editor-X6QnIU">
        <div class="chat-input-nSWBco" contenteditable="true"></div>
        <button class="semi-button chat-btn" type="button"><span class="semi-button-content">发送</span></button>
      </div>
      <ul class="chat-ul-test">
        <li class="chat-li-test">
          <div class="box-item-test is-me-test">
            <div class="box-item-message-test">
              <pre class="text-item-message-test">测试消息</pre>
            </div>
            <span class="message-status-test">已送达</span>
          </div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
